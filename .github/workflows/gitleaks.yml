name: Gitleaks (Reusable)

# Procura segredo (token, chave, senha) nos commits do PR com o gitleaks CLI. A action
# oficial pede licenca para org; o binario nao. Falso positivo: liberar no .gitleaks.toml
# do repo ([[allowlists]]). Segredo que ja estava no historico nao trava o PR; a correcao
# e rotacionar a chave no provedor.

on:
  workflow_call:
    inputs:
      version:
        description: 'Versao do gitleaks.'
        required: false
        type: string
        default: '8.30.1'

jobs:
  gitleaks:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        env:
          VERSAO: ${{ inputs.version }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v$VERSAO"
          arq="gitleaks_${VERSAO}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$arq" "$url/$arq"
          curl -sSfL -o checksums.txt "$url/gitleaks_${VERSAO}_checksums.txt"
          grep " $arq\$" checksums.txt | sha256sum -c -
          tar -xzf "$arq" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Varrer commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # No PR, so os commits do PR; sem base (workflow_dispatch), o historico inteiro.
          # Segredo que ja estava no historico nao trava PR: rotacione a chave no provedor.
          opts=()
          if [ "${EVENT:-}" = pull_request ]; then
            base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
            opts=(--log-opts="$base..$HEAD_SHA")
            echo "Varrendo $(git rev-list --count "$base..$HEAD_SHA") commit(s) do PR"
          else
            echo "Evento ${EVENT:-?}: varrendo o historico inteiro"
          fi

          relatorio="$RUNNER_TEMP/gitleaks.json"
          rc=0
          gitleaks git . ${opts[@]+"${opts[@]}"} --redact --no-banner --log-level warn --exit-code 1 \
            --report-format json --report-path "$relatorio" || rc=$?

          if [ -s "$relatorio" ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID): possivel segredo (commit \(.Commit[0:7])). Se for falso positivo, libere no .gitleaks.toml do repo"' "$relatorio"
          fi
          [ "$rc" = 0 ] && echo "Nenhum segredo encontrado"
          exit "$rc"
