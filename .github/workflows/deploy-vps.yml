name: Deploy to VPS (Reusable)

# Deploy do ambiente DEV: sobe a imagem numa VPS via SSH + docker compose.
# O runner faz broker do login ECR (gera o token e passa pra VPS via stdin);
# a VPS nao guarda credencial AWS. Tag fixada por deploy no .env do compose.
#
# O .env da VPS e compartilhado por todos os servicos e guarda tambem segredos
# (CLERK_*, ASAAS_*, DD_API_KEY). Deploys podem rodar em paralelo (varios merges
# em develop juntos): a troca do .env e o compose up acontecem sob flock, com tmp
# unico, backup rotativo e aborto se alguma variavel fosse sumir. Depois, fora do
# lock, espera o container ficar saudavel (o job falha se nao ficar).
#
# Ordem: o caller serializa os deploys do servico (concurrency por branch) e, aqui,
# o deploy e pulado se a VPS ja roda um commit mais novo (ex.: re-run de execucao antiga).

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      image:
        description: 'URI da imagem no ECR (output do build-push).'
        required: true
        type: string
      version:
        description: 'Tag da imagem (output do build-push).'
        required: true
        type: string
      vps_compose_dir:
        description: 'Diretorio na VPS com docker-compose.vps.yml e .env.'
        required: false
        type: string
        default: '/home/ubuntu'
      health-timeout:
        description: 'Segundos para o container ficar healthy depois do up (0 desliga a checagem).'
        required: false
        type: number
        default: 300
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      VPS_HOST:
        required: false
      VPS_USER:
        required: false
      VPS_SSH_KEY:
        required: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy-vps:
    name: Deploy to VPS (dev)
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Deploy via SSH + docker compose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SERVICE: ${{ inputs.service-name }}
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
          COMPOSE_DIR: ${{ inputs.vps_compose_dir }}
          HEALTH_TIMEOUT: ${{ inputs.health-timeout }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH="ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=accept-new $VPS_USER@$VPS_HOST"
          # var de tag deste servico (api-gateway -> API_GATEWAY_TAG) no .env do compose
          TAG_VAR=$(printf '%s' "${SERVICE}_TAG" | tr 'a-z-' 'A-Z_')

          # Nunca voltar versao: se o commit no ar e mais novo que o deste deploy (re-run de
          # execucao antiga, ou uma antiga que terminou depois), pula. Rollback = revert.
          NO_AR=$($SSH "grep -E '^${TAG_VAR}=' $(printf '%q' "$COMPOSE_DIR/.env") | tail -1 | cut -d= -f2-" || true)
          SHA_NO_AR=$(sed -nE 's/^[0-9]{8}-([0-9a-f]{7,40})-[a-z]+$/\1/p' <<< "$NO_AR")
          if [ -n "$SHA_NO_AR" ]; then
            # base = este deploy, head = o que esta no ar; ahead = o do ar e descendente
            STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$SHA_NO_AR" -q .status 2>/dev/null) || STATUS=desconhecido
            echo "No ar: $NO_AR | este deploy: $VERSION | comparacao: $STATUS"
            if [ "$STATUS" = ahead ]; then
              echo "::warning::Deploy pulado: a VPS ja roda $NO_AR, mais novo que $VERSION"
              echo "Deploy pulado: a VPS ja roda \`$NO_AR\`, mais novo que \`$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            echo "No ar: ${NO_AR:-nada} (sem commit reconhecivel; segue o deploy)"
          fi

          # registry vem do proprio IMAGE (<acct>.dkr.ecr.<region>.amazonaws.com/...)
          REGISTRY="${IMAGE%%/*}"
          # broker do login ECR: runner gera o token, VPS faz docker login (senha via stdin)
          ECR_PASS=$(aws ecr get-login-password --region "$AWS_REGION")
          echo "::add-mask::$ECR_PASS"
          printf '%s' "$ECR_PASS" | $SSH "docker login --username AWS --password-stdin $REGISTRY"
          # Script remoto via stdin; argumentos escapados com %q (nada interpolado no corpo).
          ARGS=$(printf '%q ' "$SERVICE" "$REGISTRY" "$TAG_VAR" "$VERSION" "$COMPOSE_DIR" "$HEALTH_TIMEOUT")
          $SSH "bash -s -- $ARGS" <<'REMOTO'
          set -euo pipefail
          SERVICE=$1; REGISTRY=$2; TAG_VAR=$3; VERSION=$4; COMPOSE_DIR=$5; HEALTH_TIMEOUT=$6
          COMPOSE="docker compose -f docker-compose.vps.yml"
          cd "$COMPOSE_DIR"

          # 1) .env + compose up sob lock: deploys paralelos se enfileiram aqui.
          exec 9>"$COMPOSE_DIR/.deploy.lock"
          echo "Aguardando lock de deploy..."
          flock -w 900 9 || { echo "::error::Timeout esperando o lock de deploy ($COMPOSE_DIR/.deploy.lock)"; exit 1; }

          touch .env
          chaves() { grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' "$1" | tr -d '=' | sort -u || true; }
          TMP=$(mktemp "$COMPOSE_DIR/.env.deploy.XXXXXX")
          trap 'rm -f "$TMP"' EXIT
          { grep -vE "^(ECR_REGISTRY|${TAG_VAR})=" .env || true; } > "$TMP"
          printf 'ECR_REGISTRY=%s\n%s=%s\n' "$REGISTRY" "$TAG_VAR" "$VERSION" >> "$TMP"

          # Nunca gravar um .env com menos variaveis do que antes (segredos perdidos).
          PERDIDAS=$(comm -23 <(chaves .env) <(chaves "$TMP"))
          if [ -n "$PERDIDAS" ]; then
            echo "::error::Deploy abortado: o .env perderia as variaveis: $(printf '%s' "$PERDIDAS" | tr '\n' ' ')"
            exit 1
          fi

          # Backup rotativo (.env.bak.1 = anterior a este deploy), mesmas permissoes do original.
          for i in 4 3 2 1; do
            if [ -f ".env.bak.$i" ]; then mv -f ".env.bak.$i" ".env.bak.$((i + 1))"; fi
          done
          cp -p .env .env.bak.1
          chmod --reference=.env "$TMP"
          mv -f "$TMP" .env
          trap - EXIT

          $COMPOSE pull "$SERVICE"
          $COMPOSE up -d --no-deps "$SERVICE"
          exec 9>&-

          # 2) Fora do lock: o container precisa ficar saudavel.
          if [ "$HEALTH_TIMEOUT" -le 0 ]; then
            echo "Checagem de saude desligada (health-timeout=0)."
            exit 0
          fi
          CONTAINER=$($COMPOSE ps -q "$SERVICE")
          if [ -z "$CONTAINER" ]; then
            echo "::error::Container de $SERVICE nao encontrado depois do up"
            exit 1
          fi
          TEM_HEALTHCHECK=$(docker inspect -f '{{if .State.Health}}sim{{end}}' "$CONTAINER")
          INICIO=$SECONDS
          while :; do
            ESTADO=$(docker inspect -f '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' "$CONTAINER")
            case "$ESTADO" in
              "running healthy") echo "$SERVICE healthy em $((SECONDS - INICIO))s"; exit 0 ;;
              "running unhealthy"|exited*|dead*) break ;;
            esac
            # Sem healthcheck no compose: basta continuar rodando por 30 s.
            if [ -z "$TEM_HEALTHCHECK" ] && [ "${ESTADO%% *}" = running ] && [ $((SECONDS - INICIO)) -ge 30 ]; then
              echo "$SERVICE rodando ha 30s (sem healthcheck no compose)"
              exit 0
            fi
            if [ $((SECONDS - INICIO)) -ge "$HEALTH_TIMEOUT" ]; then break; fi
            sleep 5
          done
          echo "::error::$SERVICE nao ficou saudavel (estado: $ESTADO). Ultimas linhas do log:"
          docker logs --tail 80 "$CONTAINER" 2>&1 || true
          exit 1
          REMOTO
          echo "Deploy VPS ok: $SERVICE=$VERSION em $VPS_HOST ($COMPOSE_DIR)"
